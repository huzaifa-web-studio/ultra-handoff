# Production stack.
#
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# Every service is self-contained here — this file does not depend on
# compose.dev.yaml. Development lives in compose.dev.yaml under its own
# project name (ultra-dev) with its own database volume, so the two stacks
# can never share state.

name: ultra

services:
  postgres:
    # PostgreSQL 18 is the current stable major (19 is still a release
    # candidate). Patch and Alpine minor are pinned deliberately — bump them
    # deliberately too, so image rebuilds stay reproducible.
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # PostgreSQL 18 moved PGDATA under a version directory, and the image's
      # VOLUME moved with it — hence the /var/lib/postgresql mount below.
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    # Redis backs Better Auth sessions and BullMQ job queues.
    image: redis:8.8.3-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  seaweedfs:
    # SeaweedFS is an S3-compatible object store (all-in-one single node).
    # S3 gateway listens on 8333, master on 9333.
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      [
        "server",
        "-dir=/data",
        "-s3",
        "-s3.config=/etc/seaweedfs/s3.json",
      ]
    volumes:
      - seaweedfsdata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    # Object storage is internal-only in production. Never publish the S3
    # gateway or master port; the API reaches it over the backend network.
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Schema migrations as a one-shot release step, not something every replica
  # races to run at boot. Built from the `dev` target because drizzle-kit is a
  # devDependency and is intentionally absent from the runtime image.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: ["bun", "run", "db:migrate"]
    working_dir: /workspace/apps/api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Handoff <[email protected]>}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-admin}
      S3_BUCKET: ${S3_BUCKET:-handoff}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The API is the only service attached to both networks: it can reach the
    # database, Redis and SeaweedFS internally, and the web tier can reach it.
    networks:
      - backend
      - frontend
    ports:
      - "${API_PORT:-3001}:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      # Baked into the client bundle at build time. Anything the browser needs
      # must be passed as a build arg in apps/web/Dockerfile, not just here.
      VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      api:
        condition: service_healthy
    # The web tier lives only on the frontend network. It can reach the API
    # but cannot resolve or connect to Postgres, Redis or SeaweedFS.
    networks:
      - frontend
    ports:
      - "${WEB_PORT:-3000}:3000"

networks:
  # Private data plane: Postgres, Redis, SeaweedFS and the API.
  backend:
    name: ultra-backend
    driver: bridge
  # Public edge: only the API and the web tier.
  frontend:
    name: ultra-frontend
    driver: bridge

volumes:
  pgdata:
    name: ultra-pgdata
  redisdata:
    name: ultra-redisdata
  seaweedfsdata:
    name: ultra-seaweedfsdata
