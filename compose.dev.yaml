# Development stack with hot reload.
#
#   docker compose --env-file .env.dev -f compose.dev.yaml up --build --watch
#   docker compose --env-file .env.dev -f compose.dev.yaml logs -f
#   docker compose --env-file .env.dev -f compose.dev.yaml down
#
# Compose cannot choose its own interpolation env file inside this file: the
# env file is selected by the CLI (--env-file) or COMPOSE_ENV_FILES. The
# package.json scripts already pass --env-file .env.dev.
#
# Nothing is bind-mounted. Code reaches the containers through Compose's
# native `develop.watch`, which means:
#   - the container's node_modules is never shadowed by the host's
#   - inotify works natively, so Vite HMR and `bun --watch` are instant
#   - no CHOKIDAR_USEPOLLING needed, even from macOS or WSL
#
# Editing package.json or bun.lock triggers `action: rebuild`, so adding a
# dependency is just "save the file" — the deps layer stays cached.

name: ultra-dev

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pgdata-dev:/var/lib/postgresql
    ports:
      # Published in development only, so you can point a GUI client at it.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8.8.3-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata-dev:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command:
      [
        "server",
        "-dir=/data",
        "-s3",
        "-s3.config=/etc/seaweedfs/s3.json",
      ]
    volumes:
      - seaweedfsdata-dev:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  mailpit:
    # Dev-only email capture. SMTP on 1025, web UI on 8025.
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  redis-insight:
    # Dev-only Redis GUI. Reachable at http://localhost:5540
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "${REDIS_INSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight:/data
    depends_on:
      redis:
        condition: service_healthy

  db-studio:
    # Dev-only Drizzle Studio. Reachable at http://localhost:4983
    # Reuses the API dev image instead of building its own, so `bun install`
    # runs once for the whole stack.
    image: ultra-dev-api
    command:
      [
        "bunx",
        "drizzle-kit",
        "studio",
        "--host",
        "0.0.0.0",
        "--port",
        "4983",
      ]
    working_dir: /workspace/apps/api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DB_STUDIO_PORT:-4983}:4983"
    restart: "no"

  # Runs once per `up`. Idempotent, so re-running is harmless.
  # To skip it: docker compose -f compose.dev.yaml up --no-deps api web
  migrate:
    image: ultra-dev-api
    command: ["bun", "run", "db:migrate"]
    working_dir: /workspace/apps/api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ultra-dev-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3001"
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Handoff <[email protected]>}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-admin}
      S3_BUCKET: ${S3_BUCKET:-handoff}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-3001}:3001"
    # The `dev` stage has no baked-in HEALTHCHECK, so it is declared here —
    # `depends_on: service_healthy` on web would otherwise wait forever.
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "--eval",
          "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    develop:
      watch:
        - path: ./apps/api/src
          action: sync
          target: /workspace/apps/api/src
          ignore:
            - node_modules
            - "**/node_modules"
        - path: ./apps/api/drizzle.config.ts
          action: sync
          target: /workspace/apps/api/drizzle.config.ts
        - path: ./packages
          action: sync
          target: /workspace/packages
          ignore:
            - node_modules
            - "**/node_modules"
        # Manifests change the dependency tree, so rebuild rather than sync.
        - path: ./package.json
          action: rebuild
        - path: ./bun.lock
          action: rebuild

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOST: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "--eval",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    develop:
      watch:
        - path: ./apps/web/src
          action: sync
          target: /workspace/apps/web/src
          ignore:
            - node_modules
            - "**/node_modules"
        - path: ./apps/web/vite.config.ts
          action: sync
          target: /workspace/apps/web/vite.config.ts
        - path: ./apps/web/tsr.config.json
          action: sync
          target: /workspace/apps/web/tsr.config.json
        - path: ./apps/web/tsconfig.json
          action: sync
          target: /workspace/apps/web/tsconfig.json
        # packages/ui is imported through a workspace symlink, so syncing the
        # whole packages tree is what makes shared-component edits hot reload.
        - path: ./packages
          action: sync
          target: /workspace/packages
          ignore:
            - node_modules
            - "**/node_modules"
        - path: ./package.json
          action: rebuild
        - path: ./bun.lock
          action: rebuild

volumes:
  pgdata-dev:
    name: ultra-pgdata-dev
  redisdata-dev:
    name: ultra-redisdata-dev
  seaweedfsdata-dev:
    name: ultra-seaweedfsdata-dev
  redisinsight:
    name: ultra-redisinsight-dev
