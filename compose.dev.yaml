# Development stack with hot reload.
#
#   docker compose -f compose.dev.yaml up --build
#   docker compose -f compose.dev.yaml logs -f
#   docker compose -f compose.dev.yaml down
#
# Nothing is bind-mounted. Code reaches the containers through Compose's
# native `develop.watch`, which means:
#   - the container's node_modules is never shadowed by the host's
#   - inotify works natively, so Vite HMR and `bun --watch` are instant
#   - no CHOKIDAR_USEPOLLING needed, even from macOS or WSL
#
# Editing package.json or bun.lock triggers `action: rebuild`, so adding a
# dependency is just "save the file" — the deps layer stays cached.

name: ultra-dev

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pgdata-dev:/var/lib/postgresql
    ports:
      # Published in development only, so you can point a GUI client at it.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Runs once per `up`. Idempotent, so re-running is harmless.
  # To skip it: docker compose -f compose.dev.yaml up --no-deps api web
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: ["bun", "run", "db:migrate"]
    working_dir: /workspace/apps/api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3001"
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-3001}:3001"
    # The `dev` stage has no baked-in HEALTHCHECK, so it is declared here —
    # `depends_on: service_healthy` on web would otherwise wait forever.
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "--eval",
          "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    develop:
      watch:
        - path: ./apps/api/src
          action: sync
          target: /workspace/apps/api/src
          ignore:
            - node_modules
            - "**/node_modules"
        - path: ./apps/api/drizzle.config.ts
          action: sync
          target: /workspace/apps/api/drizzle.config.ts
        - path: ./packages
          action: sync
          target: /workspace/packages
          ignore:
            - node_modules
            - "**/node_modules"
        # Manifests change the dependency tree, so rebuild rather than sync.
        - path: ./package.json
          action: rebuild
        - path: ./bun.lock
          action: rebuild

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOST: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "--eval",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    develop:
      watch:
        - path: ./apps/web/src
          action: sync
          target: /workspace/apps/web/src
          ignore:
            - node_modules
            - "**/node_modules"
        - path: ./apps/web/vite.config.ts
          action: sync
          target: /workspace/apps/web/vite.config.ts
        - path: ./apps/web/tsr.config.json
          action: sync
          target: /workspace/apps/web/tsr.config.json
        - path: ./apps/web/tsconfig.json
          action: sync
          target: /workspace/apps/web/tsconfig.json
        - path: ./apps/web/server.mjs
          action: sync
          target: /workspace/apps/web/server.mjs
        # packages/ui is imported through a workspace symlink, so syncing the
        # whole packages tree is what makes shared-component edits hot reload.
        - path: ./packages
          action: sync
          target: /workspace/packages
          ignore:
            - node_modules
            - "**/node_modules"
        - path: ./package.json
          action: rebuild
        - path: ./bun.lock
          action: rebuild

volumes:
  pgdata-dev:
    name: ultra-pgdata-dev
